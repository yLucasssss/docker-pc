services:
  pgadmin:
    healthcheck:
      test: ["CMD", "/venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/', timeout=4).close()"]
      interval: 5s
      timeout: 5s
      start_period: 420s
      retries: 30
  verificador:
    image: alpine
    command: ["echo", "pgAdmin pronto para o serviço dependente"]
    depends_on:
      pgadmin:
        condition: service_healthy
